<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あまり探検！わり算パズル</title>
<link rel="stylesheet" href="styles.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<header class="top"><b>🧩 あまり探検！わり算パズル</b><button id="homeBtn" class="ghost hidden">🏠 ホームへ</button></header>
<main>
<section id="home" class="view">
  <div class="homeGrid">
    <div class="card introCard">
      <p class="eyebrow">小学3年・あまりのあるわり算</p>
      <h1>10問チャレンジ！</h1>
      <p>やりたい問題をえらんで、楽しく力をつけよう。</p>
      <div id="miniPuzzle" class="miniPuzzle"></div>
      <b id="pieceText">ピース 0</b>
    </div>
    <div>
      <div class="card compactCard">
        <h2>① どんな問題にする？</h2>
        <div class="groupGrid">
          <button class="groupBtn selected" data-group="ミックス">🎲 ぜんぶミックス<br><small>いろいろ</small></button>
          <button class="groupBtn" data-group="けいさん">➗ けいさん<br><small>どんどん</small></button>
          <button class="groupBtn" data-group="あまりのきまり">🔎 あまりのきまり<br><small>大きさ・意味</small></button>
          <button class="groupBtn" data-group="たしかめ">✅ たしかめ<br><small>正しいかな</small></button>
          <button class="groupBtn" data-group="文章もんだい">📖 文章もんだい<br><small>読んで考える</small></button>
          <button class="groupBtn" data-group="あまりをどうする？">🤔 あまりをどうする？<br><small>残りを考える</small></button>
          <button class="groupBtn" data-group="考えるもんだい">🧠 考えるもんだい<br><small>チャレンジ</small></button>
        </div>
      </div>
      <div class="card compactCard">
        <h2>② 答え方をえらぼう</h2>
        <div class="modeRow">
          <button class="modeBtn selected" data-mode="keypad">🔢 テンキー</button>
          <button class="modeBtn" data-mode="hand">✏️ 画面に書く</button>
        </div>
        <p id="modeNote" class="note">テンキーでも、文章問題は単位まで答えます。</p>
      </div>
      <button id="startBtn" class="primary bigBtn">この問題で10問スタート！</button>
    </div>
  </div>
</section>

<section id="quiz" class="view quizView hidden">
  <div class="quizTop">
    <b id="qCount">1 / 10</b>
    <span id="catBadge" class="badge"></span>
    <div class="bar"><div id="barFill"></div></div>
  </div>
  <div id="quizLayout" class="quizLayout">
    <section class="questionPanel">
      <div id="prompt" class="prompt"></div>
      <div id="options" class="options"></div>
      <div id="answerArea"></div>
      <div id="aiStatus" class="aiStatus hidden">🤖 AIが答えを読んでいます…</div>
      <div id="feedback" class="feedback hidden"></div>
      <div class="actionRow">
        <button id="checkBtn" class="primary">こたえあわせ</button>
        <button id="showAnswerBtn" class="warnBtn">💡 答えを見る</button>
        <button id="nextBtn" class="secondary hidden">つぎへ →</button>
      </div>
    </section>
    <aside id="scratchCard" class="scratchCard hidden">
      <div class="scratchHead"><b>✏️ 計算メモ</b><button id="clearScratch" class="tinyBtn">消す</button></div>
      <canvas id="scratchCanvas" width="760" height="760"></canvas>
    </aside>
  </div>
</section>

<section id="puzzle" class="view hidden"><div class="card"><h2 id="worldTitle"></h2><b><span id="totalPieces">0</span> ピース</b><div id="jigsaw" class="jigsaw"></div><p id="puzzleStatus"></p><button id="puzzleHome" class="primary">ホームへ戻る</button></div></section>
<section id="result" class="view hidden"><div class="card resultCard"><div class="celebrate">🎉</div><h2>10問 おつかれさま！</h2><p id="scoreText"></p><p id="pieceEarned"></p><button id="againBtn" class="primary">同じ種類でもう10問</button> <button id="resultPuzzleBtn" class="secondary">🧩 ジグソーを見る</button> <button id="resultHomeBtn" class="ghost">ホームへ</button></div></section>
</main>
<script src="app.js?v=3"></script>
</body></html>
