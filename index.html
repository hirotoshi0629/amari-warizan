<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f8b6d"><title>あまり探検！わり算パズル</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="brand">🧩 あまり探検！わり算パズル</div><button id="homeBtn" class="ghost hidden">🏠 ホームへ</button></header><main><section id="home" class="view"><div class="hero card"><div><p class="eyebrow">小学3年・あまりのあるわり算</p><h1>10問クリアして<br>ジグソーの世界を広げよう！</h1><p>計算・文章・考える問題をバランスよく出します。問題は全2000問。</p></div><div class="puzzlePreview"><div id="miniPuzzle" class="miniPuzzle"></div><div><b id="pieceText">ピース 0</b><br><small>新しい絵がつぎつぎ登場！</small></div></div></div><div class="card"><h2>答え方をえらぼう</h2><div class="modeRow"><button class="modeBtn selected" data-mode="keypad">🔢 テンキー</button><button class="modeBtn" data-mode="hand">✏️ 画面に書く</button></div><p id="modeNote" class="note">テンキーは自動で答え合わせします。</p></div><button id="startBtn" class="primary bigBtn">10問スタート！</button><button id="puzzleBtn" class="secondary bigBtn">🧩 ジグソーを見に行く</button></section><section id="quiz" class="view hidden"><div class="progressCard"><div><b id="qCount">1 / 10</b><span id="catBadge" class="badge"></span></div><div class="bar"><div id="barFill"></div></div></div><div class="card"><div id="prompt" class="prompt"></div><div id="options" class="options"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div class="actionRow"><button id="checkBtn" class="primary">こたえあわせ</button><button id="showAnswerBtn" class="warnBtn">💡 答えを見る</button><button id="nextBtn" class="secondary hidden">つぎの問題へ →</button></div></div></section><section id="puzzle" class="view hidden"><div class="card"><div class="puzzleHeader"><div><p class="eyebrow">エンドレス・ジグソーワールド</p><h2 id="worldTitle"></h2></div><div class="pieceCounter"><span id="totalPieces">0</span> ピース</div></div><div id="jigsaw" class="jigsaw"></div><p id="puzzleStatus" class="note"></p><button id="puzzleHome" class="primary">ホームへ戻る</button></div></section><section id="result" class="view hidden"><div class="card resultCard"><div class="celebrate">🎉</div><h2>10問チャレンジ おつかれさま！</h2><p><b id="scoreText"></b></p><p id="pieceEarned"></p><div class="actionRow center"><button id="againBtn" class="primary">もう10問</button><button id="resultPuzzleBtn" class="secondary">🧩 ジグソーを見る</button><button id="resultHomeBtn" class="ghost">ホームへ</button></div></div></section></main><script src="app.js"></script></body></html>
